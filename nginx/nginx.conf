events {
  worker_connections 1024;
}

http {
  # ── Security headers ──────────────────────────────────────────────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ── Gzip ──────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1000;

  upstream sanctum_backend {
    server sanctum:3000;
    keepalive 32;
  }

  # ── Rate limiting zones ───────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # ── HTTP: redirect all to HTTPS ───────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # Return 444 (drop connection) if plain HTTP is sent to the HTTPS port
    error_page 400 = @drop;
    location @drop { return 444; }

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Proxy to Sanctum backend ──────────────────────────────────────────
    location / {
      proxy_pass http://sanctum_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }

    # ── Rate limit auth endpoints at nginx level ──────────────────────────
    location /api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://sanctum_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
